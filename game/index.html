<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
</head>
<body>
<!--BODY-START-->
<title>棍破山河</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;900&display=swap">
<style>
/* Layout: one full-bleed canvas stage, letterboxed, with touch pads overlaid on coarse pointers. Single dark ink-wash look by design. */
:root{
  --ink:#07080a; --paper:#e9dfc8; --gold:#d9a441; --cinnabar:#b8322a; --mist:#9aa3a8;
  --display:"Noto Serif TC","Songti TC","PMingLiU",serif;
  color-scheme:dark;
}
html,body{height:100%;margin:0;background:var(--ink);color:var(--paper);overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none}
#stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
canvas{display:block;background:var(--ink)}
#pad{position:fixed;inset:0;pointer-events:none;display:none}
#pad.on{display:block}
.grp{position:absolute;bottom:calc(12px + env(safe-area-inset-bottom,0px));pointer-events:auto}
.grp.l{left:max(16px,env(safe-area-inset-left,0px));display:flex;gap:10px}
.grp.r{right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.skills{display:flex;gap:8px}
.main{display:grid;grid-template-columns:repeat(2,62px);gap:8px}
.b{width:62px;height:62px;border-radius:50%;border:1.5px solid rgba(217,164,65,.55);background:rgba(10,10,12,.45);color:var(--paper);font:900 19px var(--display);display:flex;align-items:center;justify-content:center;touch-action:none}
.b.sm{width:46px;height:46px;font-size:15px}
.b.big{width:72px;height:72px;font-size:22px}
.b:active,.b.down{background:rgba(217,164,65,.35)}
#pauseBtn{position:absolute;top:calc(10px + env(safe-area-inset-top,0px));right:max(16px,env(safe-area-inset-right,0px));pointer-events:auto}
#rot{display:none;position:fixed;left:0;right:0;top:calc(14px + env(safe-area-inset-top,0px));text-align:center;font:500 14px var(--display);color:var(--gold);pointer-events:none}
@media (orientation:portrait) and (pointer:coarse){#rot{display:block}}
</style>

<div id="stage"><canvas id="c" aria-label="棍破山河 遊戲畫面"></canvas></div>
<div id="rot">橫置手機，畫面更大</div>
<div id="pad">
  <div class="b sm" id="pauseBtn" data-k="pause">‖</div>
  <div class="grp l"><div class="b big" data-k="left">◀</div><div class="b big" data-k="right">▶</div></div>
  <div class="grp r">
    <div class="skills"><div class="b sm" data-k="clone">化</div><div class="b sm" data-k="spell">定</div><div class="b sm" data-k="heal">葫</div></div>
    <div class="main"><div class="b" data-k="dodge">閃</div><div class="b" data-k="jump">躍</div><div class="b" data-k="heavy">重</div><div class="b" data-k="attack">棍</div></div>
  </div>
</div>

<script>
(()=>{
'use strict';
const W=960,H=540,GROUND=452,WORLD=3700;
const ARENA={l:2520,r:3620},SHRINE_X=2420,GATE_X=2580,BOSS_TRIGGER=2700,PROP_X=1900;
const SHRINES=[{x:80,id:'start'},{x:SHRINE_X,id:'shrine'}];
const FONT='"Noto Serif TC","Songti TC","PMingLiU",serif';
const DIFF=[
  {name:'遊歷',desc:['敵人較弱','適合體驗劇情'],dmg:.6,hp:.8,cd:1.25,gourd:5,ess:1,pw:0},
  {name:'修行',desc:['標準難度','攻守需有章法'],dmg:1,hp:1,cd:1,gourd:4,ess:1,pw:0},
  {name:'渡劫',desc:['敵人兇狠','識破判定更嚴'],dmg:1.45,hp:1.25,cd:.8,gourd:3,ess:1.3,pw:-.04}];
const CH={
  1:{name:'第一回',place:'黑松嶺',gate:'蒼 牙 嶺',boss:'蒼牙狼王',bossSub:'嶺上妖王 · 披甲持刀',rage:'怒 · 焚嶺之火',clear:'蒼牙伏誅'},
  2:{name:'第二回',place:'竹海寒寺',gate:'寒 鐘 寺',boss:'玄鶴禪仙',bossSub:'寒寺妖仙 · 羽刃如霜',rage:'怒 · 霜羽漫天',clear:'玄鶴伏誅'}};
const UPG=[
  {id:'hp',name:'氣血',desc:'最大氣血 +20',max:3,cost:60},
  {id:'st',name:'筋骨',desc:'體力上限 +15，回復加快',max:3,cost:50},
  {id:'atk',name:'棍力',desc:'所有棍法傷害 +12%',max:3,cost:80},
  {id:'focus',name:'聚勢',desc:'棍勢累積速度 +25%',max:2,cost:70},
  {id:'gourd',name:'葫蘆',desc:'葫蘆 +1 次，每口多回 10',max:2,cost:90},
  {id:'spell',name:'定身',desc:'冷卻減 3 秒，定身更久',max:2,cost:70},
  {id:'clone',name:'分身',desc:'分身多留 2 秒，傷害更高',max:2,cost:80},
  {id:'parry',name:'識破',desc:'識破判定放寬，反擊傷害 +30%',max:2,cost:70},
  {id:'quake',name:'裂地',desc:'新招：消耗棍勢的重棍送出裂地衝擊',max:1,cost:150}];
const ESS={wolf:10,shield:20,archer:15,bat:8,brute:30,boss:200,crane:300};
const upgCost=(it,lv)=>Math.round(it.cost*(1+lv*.8));
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
let scale=1,dpr=1;
function resize(){
  dpr=Math.min(window.devicePixelRatio||1,2);
  scale=Math.min(innerWidth/W,innerHeight/H);
  cv.style.width=W*scale+'px';cv.style.height=H*scale+'px';
  cv.width=Math.round(W*scale*dpr);cv.height=Math.round(H*scale*dpr);
}
addEventListener('resize',resize);resize();

// ---------- helpers ----------
const clamp=(v,a,b)=>v<a?a:v>b?b:v, rnd=(a,b)=>a+Math.random()*(b-a);
const overlap=(a,b)=>a&&b&&a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;
const ease=t=>1-Math.pow(1-clamp(t,0,1),3);
const isBoss=e=>e.type==='boss'||e.type==='crane';
const store={get(k){try{return localStorage.getItem(k);}catch(e){return null;}},set(k,v){try{localStorage.setItem(k,v);}catch(e){}},del(k){try{localStorage.removeItem(k);}catch(e){}}};

// ---------- audio ----------
let ac=null,master=null,musicBus=null,sfxBus=null,drone=null,noiseBuf=null,muted=store.get('gunpo-mute')==='1',nextStep=0,step=0,mel=6;
function audioInit(){
  if(ac){if(ac.state==='suspended')ac.resume();return;}
  try{ac=new (window.AudioContext||window.webkitAudioContext)();}catch(e){return;}
  const comp=ac.createDynamicsCompressor();comp.connect(ac.destination);
  master=ac.createGain();master.gain.value=muted?0:1;master.connect(comp);
  musicBus=ac.createGain();musicBus.gain.value=.55;musicBus.connect(master);
  sfxBus=ac.createGain();sfxBus.connect(master);
  const dl=ac.createDelay(),fb=ac.createGain(),wet=ac.createGain();dl.delayTime.value=.33;fb.gain.value=.3;wet.gain.value=.32;
  musicBus.connect(dl);dl.connect(fb);fb.connect(dl);dl.connect(wet);wet.connect(master);
  drone=ac.createGain();drone.gain.value=0;drone.connect(musicBus);
  [73.42,110,146.83].forEach((f,i)=>{const o=ac.createOscillator(),g=ac.createGain();o.type=i?'sine':'triangle';o.frequency.value=f;g.gain.value=[.5,.25,.12][i];o.connect(g).connect(drone);o.start();});
  const n=ac.sampleRate;noiseBuf=ac.createBuffer(1,n,n);const d=noiseBuf.getChannelData(0);for(let i=0;i<n;i++)d[i]=Math.random()*2-1;
  nextStep=ac.currentTime+.1;setInterval(schedule,90);
}
function toggleMute(){muted=!muted;if(master)master.gain.setTargetAtTime(muted?0:1,ac.currentTime,.05);store.set('gunpo-mute',muted?'1':'0');toast(muted?'聲音：關':'聲音：開');}
function tone(f0,f1,dur,type,vol){if(!ac)return;const o=ac.createOscillator(),g=ac.createGain(),t=ac.currentTime;
  o.type=type;o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(Math.max(f1,20),t+dur);
  g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);o.connect(g).connect(sfxBus);o.start(t);o.stop(t+dur+.02);}
function noise(dur,vol,freq,type,bus,at){if(!ac)return;const t=at||ac.currentTime,s=ac.createBufferSource(),f=ac.createBiquadFilter(),g=ac.createGain();
  s.buffer=noiseBuf;f.type=type||'bandpass';f.frequency.value=freq;g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);
  s.connect(f).connect(g).connect(bus||sfxBus);s.start(t,Math.random()*.5,dur+.02);}
const sfx={
  swing(){noise(.12,.25,1800);}, hit(){tone(180,60,.15,'square',.1);noise(.08,.3,700);},
  heavy(){tone(110,40,.35,'sawtooth',.16);noise(.25,.4,400);}, hurt(){tone(300,120,.2,'triangle',.18);},
  dodge(){noise(.15,.18,3000);}, spell(){tone(600,1400,.4,'sine',.12);tone(900,1800,.5,'sine',.06);},
  clone(){tone(500,1000,.5,'sine',.1);tone(750,1500,.6,'triangle',.05);noise(.4,.15,4000);},
  heal(){tone(400,800,.4,'sine',.1);}, perfect(){tone(1200,2400,.25,'sine',.12);},
  clang(){tone(1300,900,.12,'square',.07);noise(.1,.25,5000,'highpass');}, arrow(){noise(.18,.2,2500);},
  roar(){tone(140,50,1,'sawtooth',.18);noise(.9,.3,300);}, boom(){tone(80,30,.5,'sine',.3);noise(.4,.4,200);},
  screech(){tone(1500,700,.5,'sawtooth',.08);tone(1800,900,.45,'square',.04);},
  shrine(){[293.7,370,440].forEach(f=>tone(f,f,1.4,'sine',.06));}, buy(){[440,554,659].forEach((f,i)=>tone(f,f*1.01,.5+i*.15,'sine',.07));},
  deny(){tone(200,150,.18,'square',.06);}
};
const SCALE=[73.42,87.31,98,110,130.81,146.83,174.61,196,220,261.63,293.66,349.23,392];
function pluck(f,t,v,d){const o=ac.createOscillator(),o2=ac.createOscillator(),g=ac.createGain(),g2=ac.createGain();
  o.type='triangle';o2.type='sine';o.frequency.setValueAtTime(f*1.012,t);o.frequency.exponentialRampToValueAtTime(f,t+.06);o2.frequency.value=f*2;g2.gain.value=.3;
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.006);g.gain.exponentialRampToValueAtTime(.0008,t+d);
  o.connect(g);o2.connect(g2).connect(g);g.connect(musicBus);o.start(t);o2.start(t);o.stop(t+d+.05);o2.stop(t+d+.05);}
function drum(t,v,low){const o=ac.createOscillator(),g=ac.createGain();o.type='sine';o.frequency.setValueAtTime(low?120:210,t);o.frequency.exponentialRampToValueAtTime(low?42:95,t+.25);
  g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+.5);o.connect(g).connect(musicBus);o.start(t);o.stop(t+.55);
  noise(.07,v*.5,low?600:1800,'lowpass',musicBus,t);}
function bell(t){[[196,1,3],[541,.4,1.6],[1058,.18,.8]].forEach(([f,v,d])=>{const o=ac.createOscillator(),g=ac.createGain();o.type='sine';o.frequency.value=f;
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.07*v,t+.01);g.gain.exponentialRampToValueAtTime(.0008,t+d);o.connect(g).connect(musicBus);o.start(t);o.stop(t+d+.05);});}
function musicState(){if(mode==='title')return'calm';if(mode==='win'||mode==='clear')return'win';if(mode==='dead')return'dead';
  if(bossStarted&&boss&&!boss.dead)return boss.phase===2?'boss2':'boss';return'explore';}
function walkNote(){mel=clamp(mel+[-2,-1,-1,1,1,2][Math.floor(Math.random()*6)],4,12);return SCALE[mel];}
function schedule(){
  if(!ac)return;if(paused||shopOpen){nextStep=ac.currentTime+.1;return;}
  const ms=musicState(),c2=worldCh===2&&mode!=='title';
  const dur={calm:.5,explore:c2?.5:.42,boss:c2?.22:.2,boss2:c2?.19:.17,dead:.7,win:.42}[ms];
  drone.gain.setTargetAtTime(ms.startsWith('boss')?.05:ms==='dead'?.015:.035,ac.currentTime,.8);
  if(nextStep<ac.currentTime-.2)nextStep=ac.currentTime+.05;
  while(nextStep<ac.currentTime+.3){playStep(ms,step,nextStep,c2);nextStep+=dur;step++;}
}
function playStep(ms,b,t,c2){
  if(ms==='calm'||ms==='explore'){
    if(c2){if(b%16===0)bell(t);if(b%3===0&&Math.random()<.55)pluck(walkNote()*2,t,.05,2.2);return;}
    if(b%16===0)pluck(SCALE[0],t,.18,2.5);
    if(b%2===0&&Math.random()<.6)pluck(walkNote(),t,.09,1.6);else if(Math.random()<.15)pluck(walkNote(),t,.05,1.2);
    if(ms==='explore'&&b%8===4)drum(t,.07,true);
  }else if(ms==='boss'||ms==='boss2'){
    const p=b%16;
    if(c2){if([0,5,8,13].includes(p))drum(t,.26,true);if(ms==='boss2'&&p%4===2)drum(t,.1,false);if(p===0)bell(t);
      if(p%2===0&&Math.random()<.55)pluck(walkNote()*2,t,.06,.6);return;}
    if([0,3,6,8,11,14].includes(p))drum(t,p%8===0?.32:.18,true);
    if(ms==='boss2'&&[2,10,13,15].includes(p))drum(t,.12,false);
    if(p%4===0)pluck(SCALE[p%8===0?0:2],t,.14,.8);
    if(Math.random()<.45)pluck(walkNote(),t,.07,.5);
  }else if(ms==='dead'){if(b%4===0)pluck(SCALE[[3,1,0][Math.floor(b/4)%3]],t,.08,2.5);}
  else if(ms==='win'){if(b<32&&b%2===0)pluck(SCALE[[5,7,8,9,8,9,10,12][Math.floor(b/2)%8]],t,.1,1.8);}
}

// ---------- state ----------
let mode='title',titleSub='main',titleSel=0,diffSel=clamp(parseInt(store.get('gunpo-diff')||'1',10)||0,0,2),saveCache=null;
let run=null,ST={},shopOpen=false,shopSel=0,shopSoon=0,paused=false,worldCh=1,clearedCh=1;
let P=null,enemies=[],proj=[],parts=[],texts=[],decals=[],clones=[];
let camX=0,shake=0,hitstop=0,timeScale=1,slowT=0,zoom=1,zoomT=1,zoomTimer=0,zoomFocus=null;
let arena=null,bossStarted=false,banner=null,boss=null,deadT=0,winT=0,checkpoint='start',fadeIn=0,clock=0,shrineLit=false;
let hintMsg=null,hintQueue=[],hintsSeen={},toastMsg=null,newRecord=false,hitRects=[];
const ATK=[
  {dur:.34,hs:.09,he:.19,dmg:9,lunge:140,st:8,reach:108,a0:-1.0,a1:.55},
  {dur:.36,hs:.10,he:.21,dmg:10,lunge:150,st:8,reach:112,a0:.75,a1:-1.35},
  {dur:.42,hs:.13,he:.25,dmg:12,lunge:170,st:10,reach:125,a0:-2.9,a1:.3},
  {dur:.66,hs:.14,he:.40,dmg:9,lunge:230,st:14,reach:135,spin:true,a0:-.5,a1:-.5+Math.PI*4,mid:.27}
];
const GUARD={idle:1,guard:1,wind:1};
function loadSave(){try{const s=JSON.parse(store.get('gunpo-save')||'null');return s&&s.ch&&s.up?s:null;}catch(e){return null;}}
function saveRun(cp){if(!run)return;run.cp=cp;store.set('gunpo-save',JSON.stringify(run));}
const getBest=d=>parseFloat(store.get('gunpo-best-'+d))||null;
saveCache=loadSave();
const aggr=()=>1/DIFF[run.diff].cd;

// ---------- input ----------
const held={},buf={};
const KEYMAP={KeyA:'left',ArrowLeft:'left',KeyD:'right',ArrowRight:'right',KeyW:'up',ArrowUp:'up',Space:'jump',KeyS:'down',ArrowDown:'down',
  KeyJ:'attack',KeyK:'heavy',KeyL:'dodge',ShiftLeft:'dodge',ShiftRight:'dodge',KeyI:'spell',KeyO:'clone',KeyU:'clone',KeyR:'heal',KeyE:'heal',
  KeyF:'interact',Enter:'start',Escape:'pause',KeyP:'pause',KeyM:'mute'};
function clearBuf(){for(const k in buf)buf[k]=0;}
function press(k){
  audioInit();
  if(k==='mute'){toggleMute();return;}
  if(mode==='title'){menuInput(k);return;}
  if(shopOpen){shopInput(k);return;}
  if(k==='pause'){togglePause();return;}
  if(paused){if(k==='start'||k==='attack')paused=false;return;}
  if(!held[k])buf[k]=.2;held[k]=true;
  if(mode!=='play'&&(k==='start'||k==='attack'||k==='jump'))startOrRetry();
}
function release(k){held[k]=false;}
function togglePause(){if(mode!=='play'){startOrRetry();return;}paused=!paused;if(paused)for(const k in held)held[k]=false;}
addEventListener('keydown',e=>{const k=KEYMAP[e.code];if(k){e.preventDefault();if(!e.repeat)press(k);}});
addEventListener('keyup',e=>{const k=KEYMAP[e.code];if(k)release(k);});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&mode==='play'&&!paused&&!shopOpen)togglePause();});
function take(k){if(buf[k]>0){buf[k]=0;return true;}return false;}
const pad=document.getElementById('pad');
const touchUI=matchMedia('(pointer: coarse)').matches||'ontouchstart' in window;
if(touchUI)pad.classList.add('on');
pad.querySelectorAll('.b').forEach(b=>{
  const k=b.dataset.k;
  b.addEventListener('pointerdown',e=>{e.preventDefault();b.classList.add('down');press(k);});
  const up=()=>{b.classList.remove('down');release(k);};
  b.addEventListener('pointerup',up);b.addEventListener('pointercancel',up);b.addEventListener('pointerleave',up);
});
cv.addEventListener('pointerdown',ev=>{
  audioInit();const r=cv.getBoundingClientRect(),x=(ev.clientX-r.left)/r.width*W,y=(ev.clientY-r.top)/r.height*H;
  for(let i=hitRects.length-1;i>=0;i--){const h=hitRects[i];if(x>=h.x&&x<=h.x+h.w&&y>=h.y&&y<=h.y+h.h){h.act();return;}}
  if(mode==='title'||shopOpen)return;
  if(paused){paused=false;return;}
  if(mode!=='play')startOrRetry();
});
// gamepad (Xbox layout): A jump, B dodge, X light, Y heavy, LB clone, RB spell, LT heal, Back interact, Start pause
const GP_MAP={0:'jump',1:'dodge',2:'attack',3:'heavy',4:'clone',5:'spell',6:'heal',8:'interact',9:'pause',12:'up',13:'down',14:'left',15:'right'};
let gpPrev={},gpSeen=false;
function pollPad(){
  const gps=navigator.getGamepads?navigator.getGamepads():null;if(!gps)return;
  let gp=null;for(const g of gps)if(g){gp=g;break;}if(!gp)return;
  if(!gpSeen){gpSeen=true;toast('已連接手把');}
  const st={};
  for(const i in GP_MAP){const b=gp.buttons[i];if(b&&b.pressed)st[GP_MAP[i]]=true;}
  const ax=gp.axes[0]||0,ay=gp.axes[1]||0;
  if(ax<-.4)st.left=true;if(ax>.4)st.right=true;if(ay>.5)st.down=true;
  if(gp.buttons[9]&&gp.buttons[9].pressed&&mode==='title')st.start=true;
  for(const k of new Set([...Object.keys(st),...Object.keys(gpPrev)])){if(st[k]&&!gpPrev[k])press(k);else if(!st[k]&&gpPrev[k])release(k);}
  gpPrev=st;
}

// ---------- menus ----------
function mainItems(){
  return saveCache?[{label:`繼續旅程　${CH[saveCache.ch].name} · ${DIFF[saveCache.diff].name}`,act:continueRun},{label:'新的旅程',act:()=>{titleSub='diff';}}]
    :[{label:'開始旅程',act:()=>{titleSub='diff';}}];
}
function menuInput(k){
  if(titleSub==='main'){const items=mainItems();titleSel=clamp(titleSel,0,items.length-1);
    if(k==='up'||k==='jump'||k==='left')titleSel=(titleSel+items.length-1)%items.length;
    else if(k==='down'||k==='right')titleSel=(titleSel+1)%items.length;
    else if(k==='start'||k==='attack'||k==='pause')items[titleSel].act();}
  else{
    if(k==='left'||k==='up')diffSel=(diffSel+2)%3;
    else if(k==='right'||k==='down')diffSel=(diffSel+1)%3;
    else if(k==='start'||k==='attack')newRun(diffSel);
    else if(k==='dodge'||k==='pause'||k==='heal')titleSub='main';}
}
function newRun(d){
  store.set('gunpo-diff',String(d));
  run={diff:d,ch:1,up:{},ess:0,elapsed:0,stats:{hits:0,perfect:0,deaths:0,counters:0},cp:'start'};
  hintsSeen={};startPlay('start');
}
function continueRun(){run=loadSave();if(!run){saveCache=null;return;}run.stats=run.stats||{hits:0,perfect:0,deaths:0,counters:0};hintsSeen={};startPlay(run.cp||'start');}
function startPlay(cp){mode='play';paused=false;shopOpen=false;checkpoint=cp;resetWorld(cp);clearBuf();for(const k in held)held[k]=false;}
function nearShrine(){if(mode!=='play'||bossStarted||!P||P.state==='dead')return null;return SHRINES.find(s=>Math.abs(P.x-s.x)<70)||null;}
function openShop(sh){
  if(!sh)return;P.hp=P.maxHp;P.gourd=P.maxGourd;P.st=P.maxSt;P.exhaust=false;checkpoint=sh.id;if(sh.id==='shrine')shrineLit=true;
  shopOpen=true;shopSel=0;sfx.shrine();saveRun(sh.id);setP('idle');P.vx=0;for(const k in held)held[k]=false;clearBuf();
}
function closeShop(){shopOpen=false;clearBuf();toast('已歇息，進度已存');}
function shopInput(k){
  const n=UPG.length+1;
  if(k==='up'||k==='jump')shopSel=(shopSel+n-1)%n;
  else if(k==='down')shopSel=(shopSel+1)%n;
  else if(k==='attack'||k==='start'){if(shopSel===UPG.length)closeShop();else buy(shopSel);}
  else if(k==='dodge'||k==='pause'||k==='interact'||k==='heal')closeShop();
}
function buy(i){
  const it=UPG[i],lv=run.up[it.id]||0;
  if(lv>=it.max){toast(it.name+' 已臻圓滿');sfx.deny();return;}
  const c=upgCost(it,lv);if(run.ess<c){toast('靈蘊不足');sfx.deny();return;}
  run.ess-=c;run.up[it.id]=lv+1;applyStats();P.hp=P.maxHp;P.gourd=P.maxGourd;P.st=P.maxSt;
  sfx.buy();burst(P.x,P.y-50,30,'#ffd36b',180,.8);toast(it.name+' 修習至第 '+(lv+1)+' 層');saveRun(checkpoint);
}
function applyStats(){
  const u=run.up,d=DIFF[run.diff],g=k=>u[k]||0;
  ST={maxHp:120+20*g('hp'),maxSt:100+15*g('st'),stRegen:1+.15*g('st'),dmg:1+.12*g('atk'),focus:1+.25*g('focus'),
    maxGourd:d.gourd+g('gourd'),heal:48+10*g('gourd'),spellCd:14-3*g('spell'),freeze:.6*g('spell'),cloneT:8+2*g('clone'),cloneMult:.45+.15*g('clone'),
    perfect:.22+d.pw+.04*g('parry'),counter:1+.3*g('parry'),quake:g('quake')>0};
  if(P){P.maxHp=ST.maxHp;P.maxSt=ST.maxSt;P.maxGourd=ST.maxGourd;}
}

// ---------- entities ----------
function newPlayer(x){return{x,y:GROUND,vx:0,vy:0,face:1,hp:ST.maxHp,maxHp:ST.maxHp,st:ST.maxSt,maxSt:ST.maxSt,exhaust:false,focus:0,gourd:ST.maxGourd,maxGourd:ST.maxGourd,
  state:'idle',t:0,combo:0,queued:false,inv:0,charge:0,hitSet:new Set(),atkId:0,spellCd:0,cloneCd:0,cloneT:0,anim:0,ground:true,
  healed:false,perfect:false,counterT:0,lastAtkX:0,airUsed:false,heavyDmg:0,spent:0,boomed:false,midDone:false,trail:[],dodgeDir:1};}
function base(type,x,hp,extra){hp=Math.round(hp*DIFF[run.diff].hp);return Object.assign({type,x,y:GROUND,vx:0,vy:0,face:-1,hp,maxHp:hp,state:'idle',t:0,frozen:0,stun:0,
  anim:rnd(0,6),dead:false,alpha:1,flash:0,guardFlash:0,home:x,cd:rnd(.5,1.5),poise:100},extra||{});}
const wolf=x=>base('wolf',x,48);
const shieldWolf=x=>base('shield',x,80);
const archer=x=>base('archer',x,36);
const bat=x=>base('bat',x,24,{y:GROUND-150,hy:GROUND-150,side:Math.random()<.5?-1:1});
const brute=x=>base('brute',x,130);
const makeBoss=x=>base('boss',x,900,{state:'intro',phase:1,cd:1.2,combo:0,wind:.5,spd:1,hasBlade:true,lastAtk:''});
const makeCrane=x=>base('crane',x,950,{state:'intro',phase:1,cd:1.4,combo:0,wind:.55,spd:1,lastAtk:'',fired:0});
function spawnChapter(c){
  if(c===1)return[wolf(700),wolf(960),wolf(1040),wolf(1260),shieldWolf(1620),archer(1830),wolf(1960),shieldWolf(2080),archer(2250)];
  return[bat(560),wolf(780),bat(900),wolf(1080),bat(1180),bat(1320),brute(1650),bat(1780),archer(1960),brute(2160),bat(2260)];
}
function resetWorld(cp){
  proj=[];parts=[];texts=[];decals=[];clones=[];banner=null;hitstop=0;timeScale=1;slowT=0;shake=0;zoom=1;zoomT=1;zoomTimer=0;zoomFocus=null;
  arena=null;bossStarted=false;boss=null;hintMsg=null;hintQueue=[];worldCh=run.ch;
  applyStats();
  if(cp==='shrine'){P=newPlayer(SHRINE_X+30);enemies=[];shrineLit=true;}
  else{P=newPlayer(150);shrineLit=false;enemies=spawnChapter(run.ch);showBanner(CH[run.ch].name,CH[run.ch].place,2.6);}
  camX=clamp(P.x-W*.38,0,WORLD-W);fadeIn=1;
}
function startBoss(){
  bossStarted=true;arena=ARENA;
  enemies.forEach(e=>{if(!e.dead&&e.x<arena.l+40){burst(e.x,e.y-30,20,'#3c3f44',160,.8);e.dead=true;e.t=0;}});
  boss=worldCh===1?makeBoss(3300):makeCrane(3300);enemies.push(boss);
  showBanner(CH[worldCh].boss,CH[worldCh].bossSub,3);if(worldCh===1)sfx.roar();else sfx.screech();shake=10;kickZoom(1.12,1.6,{x:boss.x,y:GROUND-110});
}
function startOrRetry(){
  if(mode==='dead'&&deadT>1.2)startPlay(checkpoint);
  else if(mode==='clear'&&winT>2){startPlay('start');shopSoon=1.3;}
  else if(mode==='win'&&winT>2){mode='title';titleSub='main';titleSel=0;saveCache=loadSave();clock=0;}
  else return;
  clearBuf();
}
function showBanner(t,s,d){banner={t,s,d,life:d};}
function hint(id,text){if(hintsSeen[id])return;hintsSeen[id]=1;hintQueue.push(text);}
function toast(text){toastMsg={text,life:1.8};}
function kickZoom(z,dur,focus){if(z>=zoomT||zoomTimer<=0){zoomT=z;zoomTimer=dur;zoomFocus=focus||null;}}
function addText(x,y,s,col,size){texts.push({x,y,s:String(s),col,size:size||20,life:.9,vy:-60});}
function burst(x,y,n,col,spd,life,g){for(let i=0;i<n;i++){const a=rnd(0,Math.PI*2),v=rnd(.3,1)*spd;
  parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-(g?spd*.3:0),life:rnd(.5,1)*life,max:life,col,r:rnd(1.5,4),g:g||0});}}
function sparks(x,y,n,col){for(let i=0;i<n;i++){const a=rnd(0,Math.PI*2),v=rnd(200,520);
  parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:rnd(.12,.28),max:.28,col:col||'#ffe7a8',type:'streak',g:0});}}
function ring(x,y,r,col){parts.push({type:'ring',x,y,r,life:.35,max:.35,col:col||'rgba(233,223,200,.8)'});}
function dust(x,n){burst(x,GROUND,n,'#6b6458',80,.4);}
function inkSplat(x,n,col){const blobs=[];for(let i=0;i<n;i++)blobs.push({dx:rnd(-48,48),dy:rnd(-3,14),r:rnd(5,20)});
  decals.push({x,life:14,max:14,blobs,col:col||'14,8,8'});if(decals.length>30)decals.shift();}
function gainEss(e){
  const v=Math.round(ESS[e.type]*DIFF[run.diff].ess);run.ess+=v;const bx=enemyBox(e);
  for(let i=0;i<Math.min(10,2+v/12);i++)parts.push({type:'orb',x:e.x+rnd(-20,20),y:bx.y+20,vx:rnd(-140,140),vy:rnd(-240,-80),life:2.5,max:2.5,col:'#ffd36b',r:3,delay:rnd(.2,.4)});
  addText(e.x,bx.y-28,'+'+v+' 靈蘊','#d9a441',15);
}

// ---------- player ----------
function setP(s){P.state=s;P.t=0;}
function newHit(){P.hitSet=new Set();P.atkId++;}
function spend(n){P.st=Math.max(0,P.st-n);if(P.st<=0)P.exhaust=true;}
function tryDodge(move){if(P.st<16)return false;spend(16);P.dodgeDir=move||P.face;P.face=P.dodgeDir;P.perfect=false;setP('dodge');sfx.dodge();return true;}
function startAttack(i){const a=ATK[i];if(P.exhaust&&P.st<a.st)return false;spend(a.st);
  const mv=(held.right?1:0)-(held.left?1:0);if(mv)P.face=mv;
  P.combo=i;P.queued=false;P.midDone=false;newHit();setP('attack');sfx.swing();return true;}
function startCounter(){P.counterT=0;P.face=P.lastAtkX>P.x?1:-1;newHit();setP('counter');P.inv=Math.max(P.inv,.32);run.stats.counters++;
  sfx.perfect();addText(P.x,P.y-135,'反擊','#ffd36b',26);kickZoom(1.08,.25);}
function playerBox(){return{x:P.x-15,y:P.y-88,w:30,h:88};}
function playerHit(x,face){
  const s=P.state,t=P.t,y=P.y;
  if(s==='attack'){const a=ATK[P.combo];if(t>=a.hs&&t<=a.he){
    if(a.spin)return{x:x-135,y:y-125,w:270,h:125,dmg:a.dmg,heavy:false,breaker:false,knock:t>a.mid?320:120};
    return{x:face>0?x-10:x-a.reach+10,y:y-120,w:a.reach,h:115,dmg:a.dmg,heavy:false,breaker:false,knock:P.combo===2?220:150};}}
  if(s==='heavy'&&t>=.2&&t<=.34)return{x:face>0?x-20:x-160,y:y-170,w:180,h:175,dmg:P.heavyDmg,heavy:true,breaker:true,knock:380};
  if(s==='air'&&t>=.06&&t<=.2)return{x:face>0?x-15:x-105,y:y-115,w:120,h:130,dmg:10,heavy:false,breaker:false,knock:140};
  if(s==='plungeLand'&&t<=.12)return{x:x-125,y:GROUND-90,w:250,h:90,dmg:22,heavy:true,breaker:true,knock:300};
  if(s==='counter'&&t>=.06&&t<=.24)return{x:face>0?x-10:x-150,y:y-115,w:160,h:105,dmg:26,heavy:true,breaker:true,knock:400,counter:true};
  return null;
}
function updatePlayer(dt){
  P.t+=dt;P.anim+=dt;P.inv=Math.max(0,P.inv-dt);P.spellCd=Math.max(0,P.spellCd-dt);P.cloneCd=Math.max(0,P.cloneCd-dt);P.counterT=Math.max(0,P.counterT-dt);
  if(P.cloneT>0){P.cloneT-=dt;if(P.cloneT<=0)endClones();}
  const move=(held.right?1:0)-(held.left?1:0);
  const busy=['dodge','attack','heavy','charge','counter','air','plunge','plungeLand'].includes(P.state);
  if(!busy&&P.state!=='dead'){P.st=Math.min(P.maxSt,P.st+(P.exhaust?20:36)*ST.stRegen*dt);if(P.exhaust&&P.st>=35)P.exhaust=false;}
  if(P.counterT>0&&P.state!=='counter'&&P.state!=='dead'&&take('attack'))startCounter();
  switch(P.state){
    case 'dead':P.vx*=.9;break;
    case 'idle':case 'run':case 'jump':{
      P.vx=move*270;if(move)P.face=move;
      P.state=!P.ground?'jump':move?'run':'idle';
      const sh=nearShrine();
      if(sh&&P.ground&&(take('interact')||take('up'))){openShop(sh);break;}
      if((take('jump')||take('up'))&&P.ground){P.vy=-640;P.ground=false;P.airUsed=false;dust(P.x,6);}
      if(take('dodge'))tryDodge(move);
      else if(!P.ground&&!P.airUsed&&take('attack')){P.airUsed=true;newHit();setP('air');spend(6);sfx.swing();}
      else if(!P.ground&&take('heavy')){setP('plunge');P.vy=-160;newHit();spend(10);}
      else if(P.ground&&take('attack'))startAttack(0);
      else if(P.ground&&held.heavy){setP('charge');P.charge=0;buf.heavy=0;}
      else if(take('spell'))castSpell();
      else if(take('clone'))castClone();
      else if(take('heal')){if(P.gourd<=0)addText(P.x,P.y-120,'葫蘆已空','#9aa3a8',15);else if(P.ground&&P.hp<P.maxHp){setP('heal');P.healed=false;}}
      break;}
    case 'attack':{
      const a=ATK[P.combo];
      P.vx=P.t<a.hs?P.face*a.lunge:P.vx*.82;
      if(a.spin&&P.t>=a.mid&&!P.midDone){P.midDone=true;newHit();sfx.swing();}
      if(P.t>a.hs*.5&&take('attack'))P.queued=true;
      if(P.t>a.he&&take('dodge'))tryDodge(move);
      else if(P.t>a.he&&held.heavy&&P.combo>=1&&P.combo<3){setP('charge');P.charge=.3;buf.heavy=0;}
      else if(P.t>=a.dur){if(P.queued&&P.combo<3){if(!startAttack(P.combo+1))setP('idle');}else setP('idle');}
      break;}
    case 'charge':
      P.vx=0;P.charge=Math.min(1.4,P.charge+dt);
      if(Math.random()<.5)parts.push({x:P.x+rnd(-30,30),y:P.y-rnd(0,110),vx:0,vy:-rnd(40,120),life:.5,max:.5,col:P.charge>1?'#ffd36b':'#d9a441',r:rnd(1,3),g:0});
      if(take('dodge'))tryDodge(move);
      else if(!held.heavy){const spent=Math.floor(P.focus);P.focus-=spent;P.spent=spent;P.heavyDmg=Math.round(16+P.charge*16+spent*26);
        spend(14);P.boomed=false;setP('heavy');}
      break;
    case 'heavy':
      P.vx=P.t<.2?P.face*90:0;
      if(P.t>=.2&&!P.boomed){P.boomed=true;sfx.heavy();shake=6+P.spent*4;if(P.spent)kickZoom(1.06+P.spent*.02,.22);
        burst(P.x+P.face*110,GROUND,18+P.spent*10,P.spent?'#ffd36b':'#b9a77f',260,.7,600);ring(P.x+P.face*110,GROUND,90+P.spent*30,P.spent?'rgba(255,211,107,.9)':undefined);
        if(ST.quake&&P.spent>0)proj.push({kind:'quake',x:P.x+P.face*120,vx:P.face*560,life:.9,dmg:Math.round(P.heavyDmg*.5),set:new Set()});}
      if(P.t>=.62)setP('idle');
      break;
    case 'air':
      P.vx=move*200;if(move&&P.t<.05)P.face=move;
      if(P.t>=.34||(P.ground&&P.t>.2))setP(P.ground?'idle':'jump');
      break;
    case 'plunge':
      P.vx=P.face*70;if(P.t<.12)P.vy=-60;else P.vy=1250;
      if(P.ground&&P.t>.12){setP('plungeLand');newHit();sfx.heavy();shake=8;kickZoom(1.06,.18);burst(P.x,GROUND,22,'#b9a77f',280,.6,600);ring(P.x,GROUND,130);}
      break;
    case 'plungeLand':P.vx=0;if(P.t>=.42)setP('idle');break;
    case 'counter':P.vx=P.t<.1?P.face*620:P.vx*.8;if(P.t>=.46)setP('idle');break;
    case 'dodge':{const d=.36;P.vx=P.dodgeDir*560*(1-P.t/d);if(P.t>=d)setP('idle');break;}
    case 'hurt':P.vx*=.88;if(P.t>=.34)setP('idle');break;
    case 'heal':
      P.vx=0;if(P.t>.5&&!P.healed){P.healed=true;P.gourd--;const h=Math.min(ST.heal,P.maxHp-P.hp);P.hp=Math.min(P.maxHp,P.hp+ST.heal);
        addText(P.x,P.y-110,'+'+Math.round(h),'#9fd18b',22);sfx.heal();burst(P.x,P.y-50,20,'#9fd18b',120,.8);}
      if(P.t>=.85)setP('idle');
      break;
  }
  if(!P.ground||P.vy<0){const g=(P.state==='air'&&P.t<.22)?.45:1;P.vy+=1750*g*dt;P.y+=P.vy*dt;}
  if(P.y>=GROUND){if(!P.ground&&P.vy>300)dust(P.x,5);P.y=GROUND;P.vy=0;P.ground=true;}
  P.x+=P.vx*dt;
  const L=arena?arena.l+20:30,R=arena?arena.r-20:WORLD-30;P.x=clamp(P.x,L,R);
  if(['dodge','heavy','counter','plunge'].includes(P.state))P.trail.push({x:P.x,y:P.y,face:P.face,state:P.state,life:.25});
  P.trail.forEach(t=>t.life-=dt);P.trail=P.trail.filter(t=>t.life>0);
  for(const c of clones){c.x+=((P.x+c.off)-c.x)*Math.min(1,dt*10);c.x=clamp(c.x,L,R);c.y=P.y;
    if(c.atkId!==P.atkId){c.atkId=P.atkId;c.hitSet=new Set();}}
  const hb=playerHit(P.x,P.face);if(hb)applyHits(hb,P.hitSet,1,P.x,true);
  for(const c of clones){const chb=playerHit(c.x,P.face);if(chb)applyHits(chb,c.hitSet,ST.cloneMult,c.x,false);}
}
function applyHits(hb,set,mult,ox,main){
  for(const e of enemies){if(e.dead||set.has(e))continue;if(overlap(hb,enemyBox(e))){set.add(e);damageEnemy(e,hb,mult,ox,main);}}
  for(const p of proj){if((p.kind==='arrow'||p.kind==='feather')&&p.life>0&&overlap(hb,{x:p.x-16,y:p.y-6,w:32,h:12})){p.life=0;sparks(p.x,p.y,8);addText(p.x,p.y-20,'擊落','#efe6d2',16);sfx.clang();}}
}
function castSpell(){
  if(P.spellCd>0){addText(P.x,P.y-120,'定身術尚在冷卻','#9aa3a8',15);return;}
  let best=null,bd=520;for(const e of enemies){if(e.dead||e.state==='dying')continue;const d=Math.abs(e.x-P.x);if(d<bd){bd=d;best=e;}}
  if(!best){addText(P.x,P.y-120,'無目標','#9aa3a8',16);return;}
  P.spellCd=ST.spellCd;best.frozen=(isBoss(best)?2.8:4)+ST.freeze;best.stun=0;best.downed=false;sfx.spell();
  addText(best.x,enemyBox(best).y-20,'定！','#ffd36b',34);
  burst(best.x,best.y-60,40,'#ffd36b',220,1);
}
function castClone(){
  if(P.cloneCd>0){addText(P.x,P.y-120,'分身術尚在冷卻','#9aa3a8',15);return;}
  P.cloneCd=30;P.cloneT=ST.cloneT;clones=[-80,80].map(off=>({off,x:P.x+off,y:P.y,atkId:-1,hitSet:new Set()}));
  sfx.clone();addText(P.x,P.y-135,'分身','#ffd36b',28);clones.forEach(c=>burst(c.x,c.y-50,24,'#ffd36b',180,.7));
}
function endClones(){clones.forEach(c=>burst(c.x,c.y-50,18,'#d9a441',140,.6));clones=[];if(P)P.cloneT=0;}
function damageEnemy(e,hb,mult,ox,main){
  if(e.state==='dying'||e.dead)return;
  if(e.type==='shield'&&e.frozen<=0&&GUARD[e.state]&&Math.sign(ox-e.x)===e.face&&!hb.breaker){
    sparks(e.x+e.face*24,e.y-78,10);sfx.clang();e.guardFlash=.15;
    if(main){P.vx=-P.face*200;hitstop=.05;addText(e.x,e.y-140,'格擋','#9aa3a8',18);}
    return;
  }
  let dmg=hb.dmg*mult*ST.dmg;if(hb.counter)dmg*=ST.counter;if(e.frozen>0)dmg*=1.2;if(e.state==='stagger'||e.state==='landed')dmg*=1.4;if(e.state==='broken')dmg*=1.4;
  dmg=Math.max(1,Math.round(dmg));
  e.hp-=dmg;e.flash=.12;run.stats.hits++;
  if(!hb.heavy)P.focus=Math.min(3,P.focus+.13*mult*ST.focus);
  if(hb.counter&&main)P.focus=Math.min(3,P.focus+.4*ST.focus);
  if(main){hitstop=hb.heavy?.13:.055;shake=Math.max(shake,hb.heavy?9:3);if(hb.heavy)sfx.heavy();else sfx.hit();}else sfx.hit();
  if(hb.heavy&&e.frozen>0&&!(e.type==='crane'&&e.y<GROUND))e.frozen=0;
  const bx=enemyBox(e);
  addText(e.x+rnd(-15,15),bx.y-8,dmg,hb.heavy?'#ffd36b':main?'#efe6d2':'#e8c46a',hb.heavy?30:main?20:16);
  sparks(e.x-Math.sign(e.x-ox)*14,bx.y+bx.h*.45,hb.heavy?14:6,hb.heavy?'#ffd36b':'#efe6d2');
  const dir=Math.sign(e.x-ox)||P.face;
  if(isBoss(e)){
    e.poise-=hb.heavy?40:9*mult;
    if(Math.random()<.3)inkSplat(e.x+rnd(-20,20),2,'40,8,6');
    if(e.poise<=0&&!['stagger','roar','dying','leap','dive','rise','diveWind'].includes(e.state)){e.state='stagger';e.t=0;e.vx=dir*120;e.poise=100;addText(e.x,bx.y-40,'破勢','#ffd36b',28);kickZoom(1.08,.4);}
  }else if(e.frozen<=0){
    if(e.type==='shield'){
      if(hb.breaker&&GUARD[e.state]){e.state='broken';e.t=0;e.vx=dir*200;addText(e.x,e.y-160,'破防','#ffd36b',24);}
      else if(e.state!=='thrust'&&e.state!=='broken'){e.state='hurt';e.t=0;e.stun=.3;e.vx=dir*120;}
    }else if(e.type==='brute'){
      e.poise-=hb.heavy?50:12*mult;
      if(e.poise<=0&&e.state!=='stagger'){e.state='stagger';e.t=0;e.poise=100;e.vx=dir*90;addText(e.x,bx.y-30,'破勢','#ffd36b',24);}
    }else if(e.type==='bat'){e.state='hurt';e.t=0;e.stun=.35;e.vx=dir*hb.knock*.8;}
    else{e.stun=hb.heavy?.6:.28;e.state='hurt';e.t=0;e.vx=dir*hb.knock;}
  }

  for(const e of enemies){if(isBoss(e)&&e.dead)continue;DRAWERS[e.type](e);}
  drawProj();

  for(const p of parts){const a=clamp(p.life/p.max,0,1);ctx.globalAlpha=a;
    if(p.type==='streak'){ctx.strokeStyle=p.col;ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(p.x-p.vx*.035,p.y-p.vy*.035);ctx.stroke();}

  for(const a of ambient)ctx.fillRect(a.x,a.y,a.s,a.s*(p2?1:2.4));
  ctx.globalAlpha=1;
}

let last=performance.now();
function loop(now){
  const dt=Math.min(.033,(now-last)/1000);last=now;
  update(dt);render();

}
