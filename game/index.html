<style>
/* Layout: one full-bleed canvas stage, letterboxed, with touch pads overlaid on coarse pointers. Single dark ink-wash look by design. */
:root{
  --ink:#07080a; --paper:#e9dfc8; --gold:#d9a441; --cinnabar:#b8322a; --mist:#9aa3a8;
  --display:"Noto Serif TC","Songti TC","PMingLiU",serif;
  color-scheme:dark;
}
html,body{height:100%;margin:0;background:var(--ink);color:var(--paper);overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none}
#stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
canvas{display:block;background:var(--ink)}
#pad{position:fixed;inset:0;pointer-events:none;display:none}
#pad.on{display:block}
.grp{position:absolute;bottom:calc(12px + env(safe-area-inset-bottom,0px));pointer-events:none}
#pad .b{pointer-events:auto}
#pad.menu .grp,#pad.menu #pauseBtn{display:none}
.grp.l{left:max(16px,env(safe-area-inset-left,0px));display:flex;gap:10px}
.grp.r{right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.skills{display:flex;gap:8px}
.main{display:grid;grid-template-columns:repeat(2,calc(62px*var(--ps,1)));gap:8px}
.b{width:calc(62px*var(--ps,1));height:calc(62px*var(--ps,1));border-radius:50%;border:1.5px solid rgba(217,164,65,.55);background:rgba(10,10,12,.45);color:var(--paper);font:900 calc(19px*var(--ps,1)) var(--display);display:flex;align-items:center;justify-content:center;touch-action:none}
.b.sm{width:calc(46px*var(--ps,1));height:calc(46px*var(--ps,1));font-size:calc(15px*var(--ps,1))}
.b.big{width:calc(72px*var(--ps,1));height:calc(72px*var(--ps,1));font-size:calc(22px*var(--ps,1))}
.b:active,.b.down{background:rgba(217,164,65,.35)}
#pauseBtn{position:absolute;top:calc(10px + env(safe-area-inset-top,0px));right:max(16px,env(safe-area-inset-right,0px));pointer-events:auto}
#rot{display:none;position:fixed;inset:0;z-index:20;background:rgba(7,8,10,.95);color:var(--paper);font:900 22px var(--display);align-items:center;justify-content:center;flex-direction:column;gap:14px;text-align:center;padding-inline:max(16px,env(safe-area-inset-left,0px))}
#rot .ico{width:34px;height:58px;border:3px solid var(--gold);border-radius:8px;animation:rot 2.4s ease-in-out infinite}
#rot small{font:500 14px var(--display);color:var(--gold)}
@keyframes rot{0%,30%{transform:rotate(0)}60%,100%{transform:rotate(-90deg)}}
@media (prefers-reduced-motion:reduce){#rot .ico{animation:none;transform:rotate(-90deg)}}
@media (orientation:portrait) and (pointer:coarse){#rot{display:flex}}
</style>

<script>
(()=>{

const FONT='"Noto Serif TC","Songti TC","PMingLiU",serif';
const DIFF=[
  {name:'遊歷',desc:['敵人較弱','適合體驗劇情'],dmg:.6,hp:.8,cd:1.25,gourd:5,ess:1,pw:0},

const CH={
  1:{name:'第一回',place:'黑松嶺',gate:'蒼 牙 嶺',boss:'蒼牙狼王',bossSub:'嶺上妖王 · 披甲持刀',rage:'怒 · 焚嶺之火',clear:'蒼牙伏誅'},
  2:{name:'第二回',place:'竹海寒寺',gate:'寒 鐘 寺',boss:'玄鶴禪仙',bossSub:'寒寺妖仙 · 羽刃如霜',rage:'怒 · 霜羽漫天',clear:'玄鶴伏誅'},

const UPG=[
  {id:'hp',name:'氣血',desc:'最大氣血 +20',max:3,cost:60},
  {id:'st',name:'筋骨',desc:'體力上限 +15，回復加快',max:3,cost:50},
  {id:'atk',name:'棍力',desc:'所有棍法傷害 +12%',max:3,cost:80},
  {id:'focus',name:'聚勢',desc:'棍勢累積速度 +25%',max:2,cost:70},
  {id:'gourd',name:'葫蘆',desc:'葫蘆 +1 次，每口多回 10',max:2,cost:90},
  {id:'spell',name:'定身',desc:'冷卻減 3 秒，定身更久',max:2,cost:70},

  {id:'quake',name:'裂地',desc:'新招：消耗棍勢的重棍送出裂地衝擊',max:1,cost:150}];
const ESS={wolf:10,shield:20,archer:15,bat:8,brute:30,imp:12,boss:200,crane:300,golem:420};
const upgCost=(it,lv)=>Math.round(it.cost*(1+lv*.8));
// ---------- story text (original) ----------
const PROLOGUE=['山河失序之年','天上三盞明燈墜落人間','月燈落入黑松嶺','霜燈沉進竹海寒寺','火燈陷入焚天谷底','得燈之妖，各自稱王','崩山之下，一隻石猿睜開了眼','不記來處，只握一根鐵棍','棍上刻著四字：【棍破山河】'];
const ENDING=['火燈回到天上','三盞明燈重新排成一列','四季又開始輪轉','土地祠的香火一座座亮起','沒有人知道石猿去了哪裡','只聽說山腳下的孩子','撿到過一根鐵棍','棍上的字，已經磨平了'];
Object.assign(CH[1],{verse:'松濤如墨夜如鐵，狼牙咬碎半輪月。',last:'這月光……原來不刺眼。',epi:'月燈回到天上。黑松嶺的狼，第一次在夜裡睡著了。',
  talk:['土地：靈蘊是妖散去後留下的氣，留著無用，不如拿來修習。','土地：狼王的刀有時會停一下再落，別急著閃。']});
Object.assign(CH[2],{verse:'萬竿翠影藏古寺，一聲寒鐘落白霜。',last:'飛了三百年……原來落地是這種感覺。',epi:'霜燈回到天上。寒鐘停了，竹葉上的雪開始融化。',
  talk:['土地：寺裡的石僧挨得住打，等他砸完地再出手。','土地：那隻鶴在天上待不久，等牠俯衝落地，就是你的機會。']});
Object.assign(CH[3],{verse:'谷底熔漿千年沸，岩中一顆不冷心。',last:'心……終於涼了。',epi:'火燈回到天上。',
  talk:['土地：炎靈一閃紅光就要炸，別讓牠貼著你。','土地：魔君胸口那團火就是牠的心，打到牠站不穩，心就露出來了。']});
const BOSS_CH={boss:1,crane:2,golem:3};
const LORE=[
  {id:'player',name:'石猿',title:'崩山之下醒來的猿',where:0,poem:['石中一睡不知年','醒來唯有棍相伴','不問前身誰點化','但隨燈影過千山'],
   lore:'自崩山之下醒來，不記來處。身旁只有一根鐵棍，棍身刻著「棍破山河」四字。',tip:'閃避的瞬間躲過攻擊就是識破，識破後立刻出棍就是反擊。'},
  {id:'wolf',name:'黑松狼',title:'嶺上遊牙',where:1,poem:['松影深處眼如燈','三步一嗅五步停','忽然撲起無聲息','月下只聞牙咬風'],
   lore:'月燈墜嶺之後，狼群夜夜不眠，眼裡映著偷來的光。',tip:'眼睛轉紅就要撲咬。往旁閃開，趁牠收勢出棍。'},
  {id:'shield',name:'狼盾兵',title:'鐵壁前鋒',where:1,poem:['圓盾舊痕三百道','長槍只朝一方挑','前門鐵壁千斤重','身後空門無人瞧'],
   lore:'狼王的親兵，只學會了守住前方。',tip:'正面輕棍會被格擋。用重棍、落棍、反擊，或繞到牠背後。'},
  {id:'archer',name:'狼弓手',title:'松間冷箭',where:1,poem:['不近人前不露形','弦聲未響眼先瞄','一支冷箭橫穿嶺','落葉驚飛鳥離巢'],
   lore:'總在遠處，總在瞄準。射偏的箭插滿了黑松嶺的樹幹。',tip:'紅色虛線就是箭的去向。跳起或閃避，輕棍也能把箭打落。'},
  {id:'boss',name:'蒼牙狼王',title:'嶺上妖王',where:1,poem:['披甲持刀鎮嶺頭','偷來月色刃中留','生來怕黑貪燈火','一嶺狼嚎不肯休'],
   lore:'狼群裡最怕黑的那一隻。得了月燈，便再也不讓夜晚降臨。',tip:'連斬有時會停頓再出刀。半血後會擲出回旋刀，去程回程都要躲。'},
  {id:'bat',name:'寒寺飛蝠',title:'鐘下黑影',where:2,poem:['寒鐘一響萬蝠驚','倒掛梁間聽佛經','聽了千年不成佛','反把鐘聲當獵聲'],
   lore:'棲在寒鐘之下，被霜燈的冷光養大。',tip:'盤旋時打不到。跳起空中迴旋，或等牠俯衝時出棍。'},
  {id:'brute',name:'石僧',title:'守寺石像',where:2,poem:['本是山門一尊像','霜燈照久便成僧','手中石杵三千斤','敲碎經文不念經'],
   lore:'寺裡原本的石雕護法，被霜燈照了太久，忘了自己為何站在那裡。',tip:'輕棍打不退牠。躲過砸地再進攻，重棍能打破牠的架勢。'},
  {id:'crane',name:'玄鶴禪仙',title:'寒寺妖仙',where:2,poem:['聽經三百年未悟','銜燈飛上寺頂樓','羽落如刀霜滿地','一聲長唳竹林秋'],
   lore:'在寒鐘寺聽經三百年仍未開悟，索性叼走霜燈，自封為仙。',tip:'升空時跳起迴旋可以打中。定身術能讓牠直接墜地。'},
  {id:'imp',name:'炎靈',title:'谷底火種',where:3,poem:['熔漿濺起一星火','化作頑童滿谷跑','見人便要撲懷抱','抱完只剩一縷焦'],
   lore:'火燈的碎屑化成的小妖，不懂危險，只懂靠近。',tip:'身上閃紅光就要自爆。先手打倒牠，或閃避、跳開。'},
  {id:'golem',name:'熔山魔君',title:'焚天谷主',where:3,poem:['熔山千丈壓谷底','吞下火燈當作心','燒了千年燒不暖','一身岩甲一身冰'],
   lore:'原本只是谷底一座冷山。吞下火燈當作心臟之後，便再也停不下燃燒。',tip:'橫掃要跳起，火柱會順著腳下一路噴發。打到破勢時核心外露。'}];
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
let scale=1,dpr=1;
function resize(){
  dpr=Math.min(window.devicePixelRatio||1,2);
  scale=Math.min(innerWidth/W,innerHeight/H);
  cv.style.width=W*scale+'px';cv.style.height=H*scale+'px';
  cv.width=Math.round(W*scale*dpr);cv.height=Math.round(H*scale*dpr);
}
addEventListener('resize',resize);resize();

// ---------- helpers ----------
const clamp=(v,a,b)=>v<a?a:v>b?b:v, rnd=(a,b)=>a+Math.random()*(b-a);
const overlap=(a,b)=>a&&b&&a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;
const ease=t=>1-Math.pow(1-clamp(t,0,1),3);
const isBoss=e=>e.type==='boss'||e.type==='crane'||e.type==='golem';
const store={get(k){try{return localStorage.getItem(k);}catch(e){return null;}},set(k,v){try{localStorage.setItem(k,v);}catch(e){}},del(k){try{localStorage.removeItem(k);}catch(e){}}};

// ---------- audio ----------
let ac=null,master=null,musicBus=null,sfxBus=null,drone=null,noiseBuf=null,muted=store.get('gunpo-mute')==='1',nextStep=0,step=0,mel=6;
function audioInit(){
  if(ac){if(ac.state==='suspended')ac.resume();return;}
  try{ac=new (window.AudioContext||window.webkitAudioContext)();}catch(e){return;}
  const comp=ac.createDynamicsCompressor();comp.connect(ac.destination);
  master=ac.createGain();master.gain.value=muted?0:1;master.connect(comp);
  musicBus=ac.createGain();musicBus.gain.value=.55;musicBus.connect(master);
  sfxBus=ac.createGain();sfxBus.connect(master);applyVolumes(true);
  const dl=ac.createDelay(),fb=ac.createGain(),wet=ac.createGain();dl.delayTime.value=.33;fb.gain.value=.3;wet.gain.value=.32;
  musicBus.connect(dl);dl.connect(fb);fb.connect(dl);dl.connect(wet);wet.connect(master);
  drone=ac.createGain();drone.gain.value=0;drone.connect(musicBus);
  [73.42,110,146.83].forEach((f,i)=>{const o=ac.createOscillator(),g=ac.createGain();o.type=i?'sine':'triangle';o.frequency.value=f;g.gain.value=[.5,.25,.12][i];o.connect(g).connect(drone);o.start();});
  const n=ac.sampleRate;noiseBuf=ac.createBuffer(1,n,n);const d=noiseBuf.getChannelData(0);for(let i=0;i<n;i++)d[i]=Math.random()*2-1;
  nextStep=ac.currentTime+.1;setInterval(schedule,90);
}
function toggleMute(){muted=!muted;if(master)master.gain.setTargetAtTime(muted?0:1,ac.currentTime,.05);store.set('gunpo-mute',muted?'1':'0');toast(muted?'聲音：關':'聲音：開');}
function tone(f0,f1,dur,type,vol){if(!ac)return;const o=ac.createOscillator(),g=ac.createGain(),t=ac.currentTime;
  o.type=type;o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(Math.max(f1,20),t+dur);
  g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);o.connect(g).connect(sfxBus);o.start(t);o.stop(t+dur+.02);}
function noise(dur,vol,freq,type,bus,at){if(!ac)return;const t=at||ac.currentTime,s=ac.createBufferSource(),f=ac.createBiquadFilter(),g=ac.createGain();
  s.buffer=noiseBuf;f.type=type||'bandpass';f.frequency.value=freq;g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);
  s.connect(f).connect(g).connect(bus||sfxBus);s.start(t,Math.random()*.5,dur+.02);}
const sfx={
  swing(){noise(.12,.25,1800);}, hit(){tone(180,60,.15,'square',.1);noise(.08,.3,700);},
  heavy(){tone(110,40,.35,'sawtooth',.16);noise(.25,.4,400);}, hurt(){tone(300,120,.2,'triangle',.18);},
  dodge(){noise(.15,.18,3000);}, spell(){tone(600,1400,.4,'sine',.12);tone(900,1800,.5,'sine',.06);},
  clone(){tone(500,1000,.5,'sine',.1);tone(750,1500,.6,'triangle',.05);noise(.4,.15,4000);},
  heal(){tone(400,800,.4,'sine',.1);}, perfect(){tone(1200,2400,.25,'sine',.12);},
  clang(){tone(1300,900,.12,'square',.07);noise(.1,.25,5000,'highpass');}, arrow(){noise(.18,.2,2500);},
  roar(){tone(140,50,1,'sawtooth',.18);noise(.9,.3,300);}, boom(){tone(80,30,.5,'sine',.3);noise(.4,.4,200);},
  screech(){tone(1500,700,.5,'sawtooth',.08);tone(1800,900,.45,'square',.04);},
  shrine(){[293.7,370,440].forEach(f=>tone(f,f,1.4,'sine',.06));}, buy(){[440,554,659].forEach((f,i)=>tone(f,f*1.01,.5+i*.15,'sine',.07));},
  deny(){tone(200,150,.18,'square',.06);}
};
const SCALE=[73.42,87.31,98,110,130.81,146.83,174.61,196,220,261.63,293.66,349.23,392];
function pluck(f,t,v,d){const o=ac.createOscillator(),o2=ac.createOscillator(),g=ac.createGain(),g2=ac.createGain();
  o.type='triangle';o2.type='sine';o.frequency.setValueAtTime(f*1.012,t);o.frequency.exponentialRampToValueAtTime(f,t+.06);o2.frequency.value=f*2;g2.gain.value=.3;
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.006);g.gain.exponentialRampToValueAtTime(.0008,t+d);
  o.connect(g);o2.connect(g2).connect(g);g.connect(musicBus);o.start(t);o2.start(t);o.stop(t+d+.05);o2.stop(t+d+.05);}
function drum(t,v,low){const o=ac.createOscillator(),g=ac.createGain();o.type='sine';o.frequency.setValueAtTime(low?120:210,t);o.frequency.exponentialRampToValueAtTime(low?42:95,t+.25);
  g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+.5);o.connect(g).connect(musicBus);o.start(t);o.stop(t+.55);
  noise(.07,v*.5,low?600:1800,'lowpass',musicBus,t);}
function bell(t){[[196,1,3],[541,.4,1.6],[1058,.18,.8]].forEach(([f,v,d])=>{const o=ac.createOscillator(),g=ac.createGain();o.type='sine';o.frequency.value=f;
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.07*v,t+.01);g.gain.exponentialRampToValueAtTime(.0008,t+d);o.connect(g).connect(musicBus);o.start(t);o.stop(t+d+.05);});}
function musicState(){if(mode==='story')return story?story.music:'calm';if(mode==='title')return'calm';if(mode==='win'||mode==='clear')return'win';if(mode==='dead')return'dead';
  if(bossStarted&&boss&&!boss.dead)return boss.phase===2?'boss2':'boss';return'explore';}
function walkNote(){mel=clamp(mel+[-2,-1,-1,1,1,2][Math.floor(Math.random()*6)],4,12);return SCALE[mel];}
function schedule(){
  if(!ac)return;if(paused||shopOpen){nextStep=ac.currentTime+.1;return;}
  const ms=musicState(),c2=worldCh===2&&mode!=='title',c3=worldCh===3&&mode!=='title';
  const dur={calm:.5,explore:c3?.45:c2?.5:.42,boss:c3?.19:c2?.22:.2,boss2:c3?.16:c2?.19:.17,dead:.7,win:.42}[ms];
  drone.gain.setTargetAtTime(ms.startsWith('boss')?.05:ms==='dead'?.015:.035,ac.currentTime,.8);
  if(nextStep<ac.currentTime-.2)nextStep=ac.currentTime+.05;
  while(nextStep<ac.currentTime+.3){playStep(ms,step,nextStep,c2,c3);nextStep+=dur;step++;}
}
function playStep(ms,b,t,c2,c3){
  if(c3){
    if(ms==='calm'||ms==='explore'){if(b%8===0)drum(t,.2,true);if(b%8===4)drum(t,.09,false);if(b%16===0)pluck(SCALE[0],t,.16,2.5);if(b%4===2&&Math.random()<.45)pluck(walkNote(),t,.07,1.2);return;}
    if(ms==='boss'||ms==='boss2'){const q=b%16;if([0,4,8,10,12].includes(q))drum(t,q===0?.34:.2,true);if(ms==='boss2'&&[2,6,14,15].includes(q))drum(t,.14,false);
      if(q%4===0)pluck(SCALE[[0,2,0,1][q/4]],t,.15,.7);if(Math.random()<.4)pluck(walkNote(),t,.06,.5);return;}
  }
  if(ms==='calm'||ms==='explore'){
    if(c2){if(b%16===0)bell(t);if(b%3===0&&Math.random()<.55)pluck(walkNote()*2,t,.05,2.2);return;}
    if(b%16===0)pluck(SCALE[0],t,.18,2.5);
    if(b%2===0&&Math.random()<.6)pluck(walkNote(),t,.09,1.6);else if(Math.random()<.15)pluck(walkNote(),t,.05,1.2);
    if(ms==='explore'&&b%8===4)drum(t,.07,true);
  }else if(ms==='boss'||ms==='boss2'){
    const p=b%16;
    if(c2){if([0,5,8,13].includes(p))drum(t,.26,true);if(ms==='boss2'&&p%4===2)drum(t,.1,false);if(p===0)bell(t);
      if(p%2===0&&Math.random()<.55)pluck(walkNote()*2,t,.06,.6);return;}
    if([0,3,6,8,11,14].includes(p))drum(t,p%8===0?.32:.18,true);
    if(ms==='boss2'&&[2,10,13,15].includes(p))drum(t,.12,false);
    if(p%4===0)pluck(SCALE[p%8===0?0:2],t,.14,.8);
    if(Math.random()<.45)pluck(walkNote(),t,.07,.5);
  }else if(ms==='dead'){if(b%4===0)pluck(SCALE[[3,1,0][Math.floor(b/4)%3]],t,.08,2.5);}
  else if(ms==='win'){if(b<32&&b%2===0)pluck(SCALE[[5,7,8,9,8,9,10,12][Math.floor(b/2)%8]],t,.1,1.8);}
}

function press(k){

  if(k==='pause'){togglePause();return;}

  if(!held[k])buf[k]=.2;held[k]=true;
  if(mode!=='play'&&(k==='start'||k==='attack'||k==='jump'))startOrRetry();
}
function release(k){held[k]=false;}

// touch pad: one entry per finger; a finger sliding between ◀ and ▶ switches direction without lifting
const padPtr={};
const padBtnAt=(x,y)=>{const el=document.elementFromPoint(x,y);return el&&el.closest?el.closest('#pad .b'):null;};
pad.addEventListener('pointerdown',e=>{const b=e.target.closest&&e.target.closest('.b');if(!b)return;e.preventDefault();padPtr[e.pointerId]=b;b.classList.add('down');press(b.dataset.k);});
addEventListener('pointermove',e=>{const cur=padPtr[e.pointerId];if(!cur)return;const b=padBtnAt(e.clientX,e.clientY);
  const dir=k=>k==='left'||k==='right';
  if(b&&b!==cur&&dir(b.dataset.k)&&dir(cur.dataset.k)){cur.classList.remove('down');release(cur.dataset.k);padPtr[e.pointerId]=b;b.classList.add('down');press(b.dataset.k);}});
const padUp=e=>{const cur=padPtr[e.pointerId];if(!cur)return;cur.classList.remove('down');release(cur.dataset.k);delete padPtr[e.pointerId];};

// gamepad (Xbox layout): A jump, B dodge, X light, Y heavy, LB clone, RB spell, LT heal, Back interact, Start pause
const GP_MAP={0:'jump',1:'dodge',2:'attack',3:'heavy',4:'clone',5:'spell',6:'heal',8:'interact',9:'pause',12:'up',13:'down',14:'left',15:'right'};
let gpPrev={},gpSeen=false;
function pollPad(){
  const gps=navigator.getGamepads?navigator.getGamepads():null;if(!gps)return;
  let gp=null;for(const g of gps)if(g){gp=g;break;}
  if(!gp){for(const k in gpPrev)release(k);gpPrev={};return;}
  if(!gpSeen){gpSeen=true;toast('已連接手把');}
  const st={};
  for(const i in GP_MAP){const b=gp.buttons[i];if(b&&b.pressed)st[GP_MAP[i]]=true;}
  const ax=gp.axes[0]||0,ay=gp.axes[1]||0;
  if(ax<-.4)st.left=true;if(ax>.4)st.right=true;if(ay>.5)st.down=true;
  const startHeld=!!st.pause;if(startHeld&&mode==='title'){delete st.pause;st.start=true;}
  for(const k of new Set([...Object.keys(st),...Object.keys(gpPrev)])){if(st[k]&&!gpPrev[k])press(k);else if(!st[k]&&gpPrev[k])release(k);}
  gpPrev=st;if(startHeld){gpPrev.pause=true;gpPrev.start=true;}
}

function updatePlayer(dt){

      if((take('jump')||take('up'))&&P.ground){P.vy=-640;P.ground=false;P.airUsed=false;dust(P.x,6);}
      if(take('dodge'))tryDodge(move);
      else if(!P.ground&&!P.airUsed&&take('attack')){P.airUsed=true;newHit();setP('air');spend(6);sfx.swing();}
      else if(!P.ground&&take('heavy')){setP('plunge');P.vy=-160;newHit();spend(10);}

      if(a.spin&&P.t>=a.mid&&!P.midDone){P.midDone=true;newHit();sfx.swing();}
      if(P.t>a.hs*.5&&take('attack'))P.queued=true;
      if(P.t>a.he&&take('dodge'))tryDodge(move);
      else if(P.t>a.he&&held.heavy&&P.combo>=1&&P.combo<3){setP('charge');P.charge=.3;buf.heavy=0;}
      else if(P.t>=a.dur){if(P.queued&&P.combo<3){if(!startAttack(P.combo+1))setP('idle');}else setP('idle');}

      if(Math.random()<.5)parts.push({x:P.x+rnd(-30,30),y:P.y-rnd(0,110),vx:0,vy:-rnd(40,120),life:.5,max:.5,col:P.charge>1?'#ffd36b':'#d9a441',r:rnd(1,3),g:0});

        burst(P.x+P.face*110,GROUND,18+P.spent*10,P.spent?'#ffd36b':'#b9a77f',260,.7,600);ring(P.x+P.face*110,GROUND,90+P.spent*30,P.spent?'rgba(255,211,107,.9)':undefined);
        if(ST.quake&&P.spent>0)proj.push({kind:'quake',x:P.x+P.face*120,vx:P.face*560,life:.9,dmg:Math.round(P.heavyDmg*.5),set:new Set()});}

    case 'air':

      break;
    case 'plunge':

      if(P.ground&&P.t>.12){setP('plungeLand');newHit();sfx.heavy();shake=8;kickZoom(1.06,.18);burst(P.x,GROUND,22,'#b9a77f',280,.6,600);ring(P.x,GROUND,130);}
      break;

function staffAngle(){
  const s=P.state,t=P.t;
  if(s==='attack'){const a=ATK[P.combo];
    if(a.spin)return a.a0+(a.a1-a.a0)*clamp((t-a.hs*.5)/(a.he-a.hs*.5),0,1);
    return a.a0+(a.a1-a.a0)*ease((t-a.hs*.4)/(a.he-a.hs*.4));}
  if(s==='charge')return -2.5-Math.sin(t*20)*.04*P.charge;
  if(s==='heavy')return -2.6+2.9*ease((t-.08)/.2);
  if(s==='air')return -1.9+2.9*ease((t-.03)/.17);
  if(s==='plunge')return 1.3;
  if(s==='plungeLand')return 1.45;
  if(s==='counter')return .02;
  if(s==='dodge')return -.2;
  if(s==='heal')return -1.6;
  if(s==='hurt')return -1.9;
  if(s==='run')return -.35+Math.sin(P.anim*14)*.1;

  if(s==='dead')return .1;

}

  ctx.font='900 16px '+FONT;ctx.fillStyle='#c9bfa8';ctx.textAlign='left';ctx.fillText('‹ 返回',40,56);hitRects.push({x:10,y:14,w:140,h:62,act:()=>{titleSub='main';}});
}

// ---------- render ----------
// ---------- visual effects ----------
function lightShafts(ox,oy,base,rgb,dir){if(!SET.fx)return;
  ctx.save();ctx.globalCompositeOperation='lighter';
  for(let k=0;k<4;k++){const a=.03+.014*Math.sin(clock*.6+k*1.7),ang=base+dir*k*.13+Math.sin(clock*.2+k)*.02,len=620,w1=8+k*5,w2=(80+k*28)*.82;
    ctx.save();ctx.translate(ox,oy);ctx.rotate(ang);const g=ctx.createLinearGradient(0,0,len,0);g.addColorStop(0,`rgba(${rgb},${a*1.7})`);g.addColorStop(1,`rgba(${rgb},0)`);
    ctx.fillStyle=g;ctx.beginPath();ctx.moveTo(0,-w1);ctx.lineTo(len,-w2);ctx.lineTo(len,w2);ctx.lineTo(0,w1);ctx.fill();ctx.restore();}
  ctx.restore();
}
const MIST_COL={1:'205,185,165',2:'175,205,220',3:'255,140,90'};
const mistSprites={};
function mistSprite(ch){
  if(mistSprites[ch])return mistSprites[ch];
  const c=document.createElement('canvas');c.width=300;c.height=40;const g=c.getContext('2d');
  const rg=g.createRadialGradient(150,20,4,150,20,150);rg.addColorStop(0,`rgba(${MIST_COL[ch]||MIST_COL[1]},1)`);rg.addColorStop(1,`rgba(${MIST_COL[ch]||MIST_COL[1]},0)`);
  g.setTransform(1,0,0,40/300,0,0);g.fillStyle=rg;g.fillRect(0,0,300,300);
  return mistSprites[ch]=c;
}
// the four mist puffs of a row are pre-composited into one periodic strip at device resolution, then blitted 1:1 per row
function mistStrip(ch){const res=cacheRes(),k='ms'+ch+'|'+res.toFixed(4);if(VIS[k])return VIS[k];
  const spr=mistSprite(ch),c=mkCanvas(1600*res,80*res),g=c.getContext('2d');g.scale(res,res);
  for(let i=0;i<4;i++)for(const d of [0,-1600])g.drawImage(spr,i*520+d,0,600,80);
  c.res=res;return VIS[k]=c;}
function drawMist(cx){
  const st=mistStrip(worldCh);
  for(let j=0;j<3;j++){const f=.8+j*.25,yy=GROUND+10-j*14,x0=pmod(-cx*f+clock*(10+j*6),1600)-620;ctx.globalAlpha=[.11,.08,.06][j];
    for(let x=x0-1600;x<W+60;x+=1600){const a=Math.max(x,-60),b=Math.min(x+1600,W+60);if(b>a)blit(st,st.res,a-x,0,b-a,80,a,yy-40);}}
  ctx.globalAlpha=1;
}
function drawForeground(cx){
  const f=1.35,sp=380;ctx.fillStyle=worldCh===2?'rgba(4,9,8,.93)':worldCh===3?'rgba(12,4,2,.93)':'rgba(7,6,7,.93)';
  const i0=Math.floor((cx*f-260)/sp),i1=Math.ceil((cx*f+W+260)/sp);
  for(let i=i0;i<=i1;i++){const x=i*sp-cx*f+pmod(i*137,120),h=24+pmod(i*53,36);
    ctx.beginPath();ctx.moveTo(x-52,H+2);
    for(let k=0;k<9;k++){const bx=x-48+k*12,bh=h*(.5+.5*Math.abs(Math.sin(k*1.7+i)))+6;ctx.quadraticCurveTo(bx+3+Math.sin(clock*1.5+k+i)*3,H-bh,bx+9,H+2);}
    ctx.lineTo(x+62,H+2);ctx.fill();
    if(pmod(i*7,5)===0){ctx.save();ctx.globalAlpha=.6;
      if(worldCh===2){ctx.fillRect(x+20,-10,13,H+20);for(let y=40;y<H;y+=62)ctx.fillRect(x+17,y,19,4);
        for(let k=0;k<3;k++){ctx.beginPath();ctx.ellipse(x+52,60+k*30,26,4,-.5,0,Math.PI*2);ctx.fill();}}
      else if(worldCh===3){ctx.beginPath();ctx.moveTo(x-34,H+2);ctx.lineTo(x-8,H-62-pmod(i*31,24));ctx.lineTo(x+20,H-40);ctx.lineTo(x+38,H+2);ctx.fill();}
      else{ctx.beginPath();ctx.moveTo(x-20,-10);ctx.quadraticCurveTo(x+40,56,x+140,74);ctx.lineTo(x+132,86);ctx.quadraticCurveTo(x+30,78,x-24,26);ctx.fill();
        for(let k=0;k<5;k++){ctx.beginPath();ctx.ellipse(x+34+k*22,66+k*4,20,6,.3,0,Math.PI*2);ctx.fill();}}
      ctx.restore();}
  }
}
const grainFrames=[0,1,2].map(()=>{const c=document.createElement('canvas');c.width=320;c.height=180;const g=c.getContext('2d');const d=g.createImageData(320,180);
  for(let i=0;i<d.data.length;i+=4){const v=Math.random()*255|0;d.data[i]=d.data[i+1]=d.data[i+2]=v;d.data[i+3]=255;}g.putImageData(d,0,0);return c;});
let grainK=0;
function grainFx(a){
  grainK=(grainK+1)%6;ctx.save();ctx.globalAlpha=a;ctx.imageSmoothingEnabled=false;ctx.drawImage(grainFrames[grainK>>1],0,0,W,H);ctx.restore();
}
const GRADE={1:'rgba(255,170,100,.16)',2:'rgba(80,140,200,.18)',3:'rgba(255,90,40,.16)'};
function postFx(){
  if(SET.fx){ctx.globalCompositeOperation='soft-light';ctx.fillStyle=GRADE[worldCh]||GRADE[1];ctx.fillRect(0,0,W,H);ctx.globalCompositeOperation='source-over';grainFx(.05);}
  if(speedLines>0){const px=P.x-camX,py=P.y-60;ctx.save();ctx.strokeStyle=`rgba(255,240,210,${Math.min(.5,speedLines*1.4)})`;ctx.lineWidth=2;ctx.beginPath();
    for(let i=0;i<34;i++){const a=i/34*Math.PI*2+Math.sin(i*7.3)*.1,r0=170+((i*53)%60),r1=r0+260+((i*31)%200);ctx.moveTo(px+Math.cos(a)*r0,py+Math.sin(a)*r0);ctx.lineTo(px+Math.cos(a)*r1,py+Math.sin(a)*r1);}
    ctx.stroke();ctx.restore();}
  if(flashFx>0){ctx.fillStyle=`rgba(255,246,225,${Math.min(.42,flashFx*2.4)})`;ctx.fillRect(0,0,W,H);}
}
function barLag(x,y,w,h,v,lag,col,back){
  v=clamp(v,0,1);lag=clamp(lag,0,1);
  ctx.fillStyle='rgba(0,0,0,.55)';brushPath(x-2,y-1.5,w+4,h+3);ctx.fill();
  ctx.strokeStyle='rgba(217,164,65,.4)';ctx.lineWidth=1;ctx.beginPath();brushPath(x-2.5,y-2,w+5,h+4);ctx.stroke();
  ctx.fillStyle=back;brushPath(x,y,w,h);ctx.fill();
  if(lag>v)barFill(x+w*v-6,y,w*(lag-v)+6,h,'rgba(255,236,200,.8)');
  barFill(x,y,w*v,h,col);
  if(w*v>8){ctx.fillStyle='rgba(255,255,255,.2)';ctx.fillRect(x+3,y+h*.1,w*v-7,Math.max(1,h*.28));ctx.fillStyle='rgba(0,0,0,.16)';ctx.fillRect(x+3,y+h*.68,w*v-7,h*.24);}
}
function render(){
  hitRects=[];
  if(touchUI)pad.classList.toggle('menu',mode!=='play'||paused||shopOpen);
  ctx.setTransform(scale*dpr,0,0,scale*dpr,0,0);
  ctx.clearRect(0,0,W,H);
  if(mode==='title'){drawTitle();if(titleSub!=='lore')drawAmbient(false);if(SET.fx)grainFx(.04);if(toastMsg)panelText(toastMsg.text,26,'#e9dfc8',14);return;}
  if(mode==='story'){drawStory();if(toastMsg)panelText(toastMsg.text,40,'#e9dfc8',14);return;}
  const p2=boss&&boss.phase===2&&!boss.dead;
  const sx=shakeOn?(Math.random()-.5)*shake:0,sy=shakeOn?(Math.random()-.5)*shake:0;
  ctx.save();ctx.translate(sx,sy);
  if(zoom!==1){const f=zoomFocus||{x:P.x,y:P.y-60},fx=clamp(f.x-camX,120,W-120),fy=f.y;ctx.translate(fx,fy);ctx.scale(zoom,zoom);ctx.translate(-fx,-fy);}
  drawBackdrop(camX,p2);drawGround(camX);
  ctx.save();ctx.translate(-Math.round(camX),0);
  drawProps();drawDecals();
  if(arena&&bossStarted){ctx.fillStyle=worldCh===2?'rgba(120,190,230,.16)':'rgba(200,70,40,.18)';ctx.fillRect(arena.l-6,GROUND-260,6,260);ctx.fillRect(arena.r,GROUND-260,6,260);}
  ctx.fillStyle='rgba(0,0,0,.35)';
  for(const e of enemies){if(e.dead&&e.alpha<=0)continue;const k=1-Math.min(.7,(GROUND-e.y)/400),r=isBoss(e)?50:e.type==='wolf'?36:e.type==='bat'?16:e.type==='brute'?40:26;
    ctx.beginPath();ctx.ellipse(e.x,GROUND+2,r*k,6*k,0,0,Math.PI*2);ctx.fill();}
  ctx.beginPath();ctx.ellipse(P.x,GROUND+2,20*(1-Math.min(.6,(GROUND-P.y)/300)),5,0,0,Math.PI*2);ctx.fill();
  for(const e of enemies){if(isBoss(e)&&e.dead)continue;DRAWERS[e.type](e);}
  drawProj();
  drawPlayer();
  for(const p of parts){const a=clamp(p.life/p.max,0,1);ctx.globalAlpha=a;
    if(p.type==='streak'){ctx.strokeStyle=p.col;ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(p.x-p.vx*.035,p.y-p.vy*.035);ctx.stroke();}
    else if(p.type==='ring'){const k=1-a;ctx.strokeStyle=p.col;ctx.lineWidth=3*a+1;ctx.beginPath();ctx.ellipse(p.x,p.y,p.r*(.3+k*.7),p.r*.18*(.3+k*.7),0,0,Math.PI*2);ctx.stroke();}
    else if(p.type==='orb'){ctx.globalAlpha=1;ctx.fillStyle='rgba(255,211,107,.3)';ctx.beginPath();ctx.arc(p.x,p.y,7,0,Math.PI*2);ctx.fill();ctx.fillStyle='#ffe6a0';ctx.beginPath();ctx.arc(p.x,p.y,2.6,0,Math.PI*2);ctx.fill();}
    else{ctx.fillStyle=p.col;ctx.fillRect(p.x-p.r/2,p.y-p.r/2,p.r,p.r);}}
  ctx.globalAlpha=1;
  for(const t of texts){ctx.globalAlpha=clamp(t.life*2,0,1);ctx.font='900 '+t.size+'px '+FONT;ctx.textAlign='center';ctx.lineWidth=3;ctx.strokeStyle='rgba(0,0,0,.7)';ctx.strokeText(t.s,t.x,t.y);ctx.fillStyle=t.col;ctx.fillText(t.s,t.x,t.y);}
  ctx.globalAlpha=1;
  ctx.restore();
  if(SET.fx)drawMist(camX);drawForeground(camX);
  drawAmbient(p2);
  ctx.restore();
  const vg=ctx.createRadialGradient(W/2,H/2,H*.35,W/2,H/2,H*.9);vg.addColorStop(0,'rgba(0,0,0,0)');vg.addColorStop(1,'rgba(0,0,0,.55)');ctx.fillStyle=vg;ctx.fillRect(0,0,W,H);
  postFx();
  if(timeScale<1){ctx.fillStyle='rgba(217,164,65,.08)';ctx.fillRect(0,0,W,H);}
  if(P.hp<P.maxHp*.3&&mode==='play'){ctx.fillStyle=`rgba(140,20,10,${.12+Math.sin(clock*5)*.06})`;ctx.fillRect(0,0,W,H);}
  drawHUD();drawBanner();
  if(hintMsg&&!paused&&!shopOpen){ctx.globalAlpha=Math.min(1,hintMsg.life*2,(5-hintMsg.life)*4);panelText(hintMsg.text,96,'#e9dfc8',15);ctx.globalAlpha=1;}
  const sh=!shopOpen&&!paused&&nearShrine();
  if(sh)panelText(touchUI?'輕觸此處：歇息 · 修習':'按 F 歇息 · 修習',H-70,'#ffe6a0',15,()=>{if(P.ground&&['idle','run','jump'].includes(P.state))openShop(sh);});
  if(!bossStarted&&mode==='play'&&P.x<300&&P.x>150&&run.elapsed<8&&!sh){ctx.textAlign='center';ctx.fillStyle='rgba(233,223,200,.7)';ctx.font='500 15px '+FONT;ctx.fillText('向右前行 →',W/2,H-30);}
  if(subtitle){ctx.globalAlpha=clamp(Math.min(subtitle.life*1.5,(4.2-subtitle.life)*3),0,1);panelText(subtitle.text,H-86,'#efe6d2',16);ctx.globalAlpha=1;}
  if(fadeIn>0){ctx.fillStyle=`rgba(0,0,0,${fadeIn})`;ctx.fillRect(0,0,W,H);}
  if(shopOpen)drawShop();
  drawOverlay();
  if(toastMsg)panelText(toastMsg.text,shopOpen?468:130,'#d9a441',14);
}
function drawAmbient(p2){
  if(worldCh===3&&mode!=='title'){ctx.fillStyle=p2?'rgba(255,200,120,.9)':'rgba(255,140,60,.8)';for(const a of ambient)ctx.fillRect(a.x,a.y,a.s+.8,a.s+.8);return;}
  if(worldCh===2&&mode!=='title'){
    ctx.beginPath();
    if(p2){ctx.fillStyle='rgba(235,245,250,.75)';for(const a of ambient){ctx.moveTo(a.x+a.s+.6,a.y);ctx.arc(a.x,a.y,a.s+.6,0,Math.PI*2);}}
    else{ctx.fillStyle='rgba(125,154,120,.5)';for(const a of ambient){const rx=a.s*3+2;ctx.moveTo(a.x+Math.cos(a.rot)*rx,a.y+Math.sin(a.rot)*rx);ctx.ellipse(a.x,a.y,rx,1.2,a.rot,0,Math.PI*2);}}
    ctx.fill();
    return;}
  ctx.globalAlpha=.5;ctx.fillStyle=p2?'#ff8a4a':'#cfc2a4';
  for(const a of ambient)ctx.fillRect(a.x,a.y,a.s,a.s*(p2?1:2.4));
  ctx.globalAlpha=1;
}

let last=performance.now();
let halted=false;
function loop(now){
  if(halted)return;
  const dt=Math.min(.033,(now-last)/1000);last=now;
  update(dt);render();
  requestAnimationFrame(loop);
}
(document.fonts&&document.fonts.load?Promise.all([document.fonts.load('900 20px "Noto Serif TC"'),document.fonts.load('500 20px "Noto Serif TC"')]).catch(()=>{}):Promise.resolve())
  .finally(()=>requestAnimationFrame(loop));
window.__game={get mode(){return mode},get P(){return P},get enemies(){return enemies},get boss(){return boss},get proj(){return proj},get run(){return run},
  get shopOpen(){return shopOpen},get titleSub(){return titleSub},get worldCh(){return worldCh},get story(){return story},get subtitle(){return subtitle},get banner(){return banner},get deadT(){return deadT},get bossStarted(){return bossStarted},get arena(){return arena},get paused(){return paused},
  press,release,startBoss,buy,newRun,closeShop,openShop:(i)=>openShop(SHRINES[i||0]),step:(dt)=>update(dt),halt:()=>{halted=true;},UPG,SHRINE_X,BOSS_TRIGGER,GROUND};
})();
